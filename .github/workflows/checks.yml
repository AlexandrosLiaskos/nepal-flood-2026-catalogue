name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    name: Site (Astro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install the packages
        run: pnpm install --frozen-lockfile
      - name: Test records
        run: cp tests/fixtures/catalogue/* catalogue/
      - name: Build
        run: pnpm build
      - name: Built pages and files
        run: |
          for file in index.html about/index.html assessment/index.html resources/index.html \
                      assets/index.html searches/index.html review/assets/index.html nominate/index.html \
                      review-article/index.html 404.html data/catalogue.json data/catalogue.csv \
                      data/review_status.json data/CITATION.cff LICENSE.md THIRD_PARTY_NOTICES.md \
                      sitemap-index.xml; do
            test -s "dist/$file" || { echo "Missing: dist/$file"; exit 1; }
          done

  server:
    name: Server files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Visit counter
        run: |
          python -m py_compile deployment/visit_counter.py
          python -m unittest discover --start-directory tests --verbose
      - name: Container file
        run: docker compose --file deployment/compose.yaml config --quiet
      - name: Web server configuration
        run: |
          docker run --rm --network none --add-host counter:127.0.0.1 \
            -v "$PWD/deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
