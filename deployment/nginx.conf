map $uri $catalogue_cache_control {
    default "public, max-age=0, must-revalidate";
    ~^/_astro/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://tiles.openfreemap.org; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https://tiles.openfreemap.org; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; upgrade-insecure-requests" always;
    add_header Cache-Control $catalogue_cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/visit {
        access_log off;
        proxy_pass http://counter:8766/api/visit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
    }

    location ~* \.(?:csv|json|geojson|xml|txt)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
